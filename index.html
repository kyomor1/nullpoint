<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Приложения Kyo Mori для Windows: Converty, FPS Scope и D-Shift.">
<title>Nullpoint</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: sticky top bar (разделы + RU/EN) → views (каталог / страница приложения / лаборатория) в колонке 1180px; лаборатория отмечена янтарной «предупреждающей» лентой */
:root {
  --bg: #0b0d12;
  --surface: #12151d;
  --surface-2: #191d28;
  --line: #262b39;
  --fg: #e8eaf1;
  --muted: #8b91a4;
  --accent: #7fe3f0;
  --accent-ink: #062126;
  --lab: #ffb547;
  --lab-ink: #2a1a00;
  --ok: #7fe3a8;
  --warm: #ffd166;
  --hot: #ff7a7a;

  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-body: "Onest", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;

  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }

.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 20px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: 0.02em; }
.logo-mark { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); position: relative; flex: none; }
.logo-mark::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { text-decoration: none; color: var(--muted); padding: 8px 14px; border-radius: 999px; font-weight: 500; font-size: 15px; transition: color .15s, background .15s; white-space: nowrap; }
.nav a:hover { color: var(--fg); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
.nav a.lab-link[aria-current="page"] { color: var(--lab-ink); background: var(--lab); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
.lang button { background: none; border: 0; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
@media (max-width: 640px) {
  .top .wrap { gap: 8px; }
  .logo span { display: none; }
  .nav a { padding: 7px 9px; font-size: 13.5px; }
  .nav a[data-nav="about"] { display: none; }
}

/* ---------- hero ---------- */
.hero { position: relative; padding-block: 64px 40px; overflow: hidden; }
.hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 70% 80% at 20% 0%, #000 0%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse 70% 80% at 20% 0%, #000 0%, transparent 70%);
  opacity: .55;
}
.hero .wrap { position: relative; display: grid; grid-template-columns: 1.25fr 1fr; gap: 48px; align-items: end; }
.eyebrow { font-family: var(--f-mono); font-size: 13px; color: var(--accent); letter-spacing: 0.04em; margin-bottom: 20px; }
.hero h1 { font-size: clamp(2.1rem, 5.2vw, 3.9rem); font-weight: 700; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { margin-top: 20px; font-size: 18px; color: var(--muted); max-width: 52ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.btn {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
  padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 15px;
  transition: transform .15s, border-color .15s, background .15s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 85%, white); }
.btn.lab { background: var(--lab); color: var(--lab-ink); border-color: var(--lab); }
.btn.small { padding: 9px 14px; font-size: 14px; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; flex: none; }

.feed { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; }
.feed-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.feed-head i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.feed-head span { margin-left: 8px; }
.feed ol { list-style: none; margin: 0; padding: 8px 0; font-family: var(--f-mono); font-size: 13px; }
.feed li { display: grid; grid-template-columns: 62px 1fr; gap: 12px; padding: 7px 16px; }
.feed li time { color: var(--muted); font-variant-numeric: tabular-nums; }
.feed li b { font-weight: 500; color: var(--fg); }
.feed li .tag { color: var(--accent); }
.feed li a { text-decoration: none; }
.feed li a:hover b { text-decoration: underline; text-underline-offset: 3px; }
.feed li.cursor span { color: var(--muted); }
.feed li.cursor span::after { content: "▍"; color: var(--accent); margin-left: 4px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.stats { display: flex; gap: 32px; margin-top: 36px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--f-display); font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
@media (max-width: 860px) {
  .hero .wrap { grid-template-columns: 1fr; gap: 32px; }
  .hero { padding-block: 40px 24px; }
}

/* ---------- sections ---------- */
.section { padding-block: 40px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; }
.section-head h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
.section-head p { color: var(--muted); margin-top: 8px; max-width: 60ch; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { position: relative; }
.search input {
  background: var(--surface); border: 1px solid var(--line); color: var(--fg); font: inherit; font-size: 15px;
  padding: 10px 14px 10px 38px; border-radius: 10px; width: 240px; max-width: 100%;
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: transparent; padding: 8px 14px; border-radius: 999px;
  font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); cursor: pointer;
}
.chip:hover { color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
@media (max-width: 560px) { .search, .search input { width: 100%; } .toolbar { width: 100%; } }

/* ---------- app cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 20px; }
.card {
  display: flex; flex-direction: column; text-decoration: none; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  transition: border-color .2s, transform .2s;
}
.card:hover { border-color: hsl(var(--h) 70% 60% / .6); transform: translateY(-3px); }
.card-preview { padding: 18px 18px 0; background: radial-gradient(120% 90% at 50% 0%, hsl(var(--h) 70% 50% / .16), transparent 70%); }
.card-preview .shot { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 0; }
.card-body { padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; border-top: 1px solid var(--line); flex: 1; }
.card-body h3 { font-size: 19px; font-weight: 500; }
.card-body p { color: var(--muted); font-size: 14.5px; margin-top: 4px; }
.card-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.ver { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.no-results { padding: 48px 0; text-align: center; color: var(--muted); grid-column: 1 / -1; }

.icon {
  --s: 48px; width: var(--s); height: var(--s); flex: none; border-radius: 28%;
  display: grid; place-items: center;
  background: linear-gradient(145deg, hsl(var(--h) 75% 62%), hsl(calc(var(--h) + 40) 70% 42%));
  color: #0b0d12; box-shadow: inset 0 1px 0 hsl(0 0% 100% / .35), 0 6px 20px hsl(var(--h) 70% 40% / .3);
}
.icon svg { width: 56%; height: 56%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.plats { display: flex; gap: 6px; flex-wrap: wrap; }
.plat { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }

/* ---------- mock screenshots (схемы вместо реальных скриншотов) ---------- */
.shot {
  position: relative; aspect-ratio: 16 / 10; max-width: 100%; width: 100%; container-type: inline-size;
  background: #0f1219; border: 1px solid #2a3040; border-radius: 10px; overflow: hidden;
  display: flex; flex-direction: column;
}
.shot .tb { display: flex; gap: 5px; padding: 7px 9px; background: #151924; border-bottom: 1px solid #232838; flex: none; }
.shot .tb i { width: 7px; height: 7px; border-radius: 50%; background: #2e3446; }
.shot .tb i:first-child { background: hsl(var(--h) 70% 60%); }
.shot .bd { flex: 1; display: flex; gap: 8px; padding: 9px; min-height: 0; }
.sk { background: #1d2230; border-radius: 4px; }
.sk.hi { background: hsl(var(--h) 70% 60%); }
.sk.mid { background: hsl(var(--h) 45% 35%); }
.v-side { width: 26%; display: flex; flex-direction: column; gap: 6px; }
.v-main { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.v-row { display: flex; gap: 6px; align-items: center; }

.t-ok { color: var(--ok); } .t-warm { color: var(--warm); }

/* настоящие скриншоты */
.shot-img { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 10px; border: 1px solid #2a3040; background: #1b1e27; }
.card-preview .shot-img { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 0; aspect-ratio: 16 / 10; object-fit: cover; object-position: top left; }
.lb-inner .shot-img { width: auto; max-height: 78vh; }

/* ---------- detail ---------- */
.back { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); text-decoration: none; margin-top: 28px; }
.back:hover { color: var(--fg); }
.app-head { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; padding-block: 28px 32px; border-bottom: 1px solid var(--line); }
.app-head .icon { --s: 88px; }
.app-head h1 { font-size: clamp(2rem, 4.4vw, 3rem); }
.app-head .tagline { color: var(--muted); font-size: 18px; margin-top: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 14px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 500; }
@media (max-width: 760px) {
  .app-head { grid-template-columns: auto 1fr; }
  .app-head .icon { --s: 64px; }
  .app-head > .btn { grid-column: 1 / -1; justify-content: center; }
}

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 40px; padding-block: 36px 56px; }
@media (max-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.layout h2 { font-size: 20px; font-weight: 500; margin-bottom: 16px; }
.block + .block { margin-top: 44px; }

.gallery { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px; }
.gallery figure { margin: 0; flex: 0 0 min(78%, 520px); scroll-snap-align: start; }
.gallery figcaption { font-size: 13px; color: var(--muted); margin-top: 10px; }
.gallery button { all: unset; display: block; width: 100%; cursor: zoom-in; border-radius: 10px; }
.gallery button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.prose { font-size: 17px; max-width: 65ch; }
.features { list-style: none; padding: 0; margin: 20px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 10px; }
.features li { display: flex; gap: 10px; align-items: baseline; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 15px; }
.features li::before { content: ""; width: 6px; height: 6px; border-radius: 2px; flex: none; background: hsl(var(--h) 75% 62%); transform: translateY(-2px); }

.keys { display: flex; flex-direction: column; gap: 8px; }
.keys div { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); flex-wrap: wrap; }
.keys span { font-size: 15px; }
kbd { font-family: var(--f-mono); font-size: 12px; padding: 3px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px; white-space: nowrap; }
.kbds { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }

.temps { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; font-family: var(--f-mono); font-size: 12px; }
.temps span { padding: 4px 9px; border-radius: 999px; border: 1px solid currentColor; }

.dl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.dl-tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.dl-tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 10px; cursor: pointer; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
.dl-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: hsl(var(--h) 75% 62%); }
.dl-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.dl-file { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.dl-file .kind { font-weight: 600; }
.dl-file .fname { font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.dl-file .btn { justify-content: center; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 14.5px; margin: 0; }
.kv dt { color: var(--muted); font-family: var(--f-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding-top: 3px; }
.kv dd { margin: 0; }

.changelog { list-style: none; padding: 0; margin: 0; border-left: 1px solid var(--line); }
.changelog > li { position: relative; padding: 0 0 22px 20px; }
.changelog > li::before { content: ""; position: absolute; left: -5px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); }
.changelog > li:first-child::before { border-color: hsl(var(--h) 75% 62%); background: hsl(var(--h) 75% 62%); }
.changelog .cv { font-family: var(--f-mono); font-size: 13px; }
.changelog .cv b { font-weight: 500; }
.changelog .cv span { color: var(--muted); margin-left: 8px; }
.changelog ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; }

/* ---------- lab ---------- */
.hazard { height: 10px; background: repeating-linear-gradient(-45deg, var(--lab) 0 12px, transparent 12px 24px); opacity: .9; }
.lab-hero { padding-block: 48px 28px; }
.lab-hero .eyebrow { color: var(--lab); }
.lab-hero h1 { font-size: clamp(2rem, 5vw, 3.4rem); }
.lab-hero h1 em { font-style: normal; color: var(--lab); }
.lab-hero p { color: var(--muted); font-size: 18px; margin-top: 16px; max-width: 60ch; }

.stage-legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 32px; }
.stage-legend div { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.stage-legend div::before { content: ""; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--lab) calc(25% + var(--n) * 25%), transparent); }
.stage-legend b { font-family: var(--f-mono); font-weight: 500; font-size: 13px; color: var(--lab); letter-spacing: .04em; }
.stage-legend span { font-size: 14px; color: var(--muted); }
@media (max-width: 760px) { .stage-legend { grid-template-columns: 1fr 1fr; } }

.lab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(480px, 100%), 1fr)); gap: 20px; padding-bottom: 56px; }
.empty {
  border: 1px dashed color-mix(in srgb, var(--lab) 45%, var(--line)); border-radius: var(--r); padding: 40px 24px;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin-block: 8px 56px;
  background: repeating-linear-gradient(-45deg, transparent 0 14px, color-mix(in srgb, var(--lab) 4%, transparent) 14px 28px);
}
.empty .flask { width: 44px; height: 44px; color: var(--lab); }
.empty h3 { font-size: 20px; font-weight: 500; }
.empty p { color: var(--muted); max-width: 46ch; }

/* lab teaser on home */
.teaser { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.teaser-in { padding: 24px; display: grid; grid-template-columns: 1fr 1.4fr; gap: 28px; align-items: center; }
.teaser h2 { font-size: clamp(1.4rem, 3vw, 1.9rem); }
.teaser h2 em { font-style: normal; color: var(--lab); }
.teaser p { color: var(--muted); margin: 10px 0 18px; }
.teaser .slot { border: 1px dashed var(--line); border-radius: 12px; padding: 20px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; }
.teaser .slot div { display: flex; align-items: center; gap: 10px; }
.teaser .slot i { width: 30px; height: 30px; border-radius: 9px; border: 1px dashed var(--line); flex: none; }
.teaser .slot div:first-child i { border-color: color-mix(in srgb, var(--lab) 60%, transparent); }
@media (max-width: 820px) { .teaser-in { grid-template-columns: 1fr; } }

/* about */
.about { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; padding-block: 48px 64px; border-top: 1px solid var(--line); margin-top: 24px; }
.about h2 { font-size: clamp(1.4rem, 3vw, 1.9rem); margin-bottom: 14px; }
.about p { color: var(--muted); max-width: 60ch; }
.about p + p { margin-top: 12px; }
.contacts { display: flex; flex-direction: column; gap: 8px; }
.contact { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.contact span { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.contact code { font-family: var(--f-mono); font-size: 14px; user-select: all; overflow-wrap: anywhere; }
.copy { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.copy:hover { color: var(--fg); }
.sign { align-self: center; justify-self: start; display: flex; flex-direction: column; gap: 4px; padding: 20px 24px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }

const mock = (a, i) => `<img class="shot-img" src="${a.images[i]}" alt="${a.name}: ${L(a.shots)[i]}" width="${a.shotSize[0]}" height="${a.shotSize[1]}" loading="lazy">`;
const dlUrl = (a, f) => `${RELEASES}/${a.release}/${f.file}`;

/* ---------- views ---------- */
let query = '';

function home() {
  const feed = APPS.flatMap(a => a.log.map(l => ({ d: l.d, html: `<a href="#${a.id}"><b>${a.name} ${l.v}</b></a> <span class="tag">${t('release')}</span>` })))
    .sort((x, y) => y.d.localeCompare(x.d)).slice(0, 5);

  view.innerHTML = `<div class="view">
  <section class="hero"><div class="wrap">
    <div>
      <div class="eyebrow">${t('eyebrow')(APPS.length)}</div>
      <h1>${t('h1')}</h1>
      <p class="lead">${t('lead')}</p>
      <div class="hero-actions">
        <a class="btn primary" href="#catalog">${t('to_catalog')}</a>
        <a class="btn" href="#lab">${t('to_lab')}</a>
      </div>
      <div class="stats">
        <div class="stat"><b>${APPS.length}</b><span>${t('stat_apps')}</span></div>
        <div class="stat"><b>${lang === 'ru' ? '0 ₽' : '$0'}</b><span>${t('stat_free')}</span></div>
        <div class="stat"><b>${fmtDate(feed[0].d, true)}</b><span>${t('stat_upd')}</span></div>
      </div>
    </div>
    <div class="feed">
      <div class="feed-head"><i></i><i></i><i></i><span>changelog --recent</span></div>
      <ol>${feed.map(f => `<li><time datetime="${f.d}">${fmtDate(f.d, true)}</time><span>${f.html}</span></li>`).join('')}
        <li class="cursor"><time>…</time><span>${t('next')}</span></li></ol>
    </div>
  </div></section>

  <section class="section" id="catalog"><div class="wrap">
    <div class="section-head">
      <div><h2>${t('apps_h')}</h2><p>${t('apps_p')}</p></div>
      <div class="toolbar">
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="${t('search')}" aria-label="${t('search')}"></label>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div></section>

  <section class="section"><div class="wrap">
    <div class="teaser"><div class="hazard"></div><div class="teaser-in">
      <div><h2>${t('teaser_h')}</h2><p>${t('teaser_p')}</p><a class="btn lab" href="#lab">${t('teaser_btn')}</a></div>
      <div class="slot"><div><i></i>${t('slot1')}</div><div><i></i>${t('slot2')}</div><div><i></i>${t('slot3')}</div></div>
    </div></div>
  </div></section>

  ${aboutBlock()}
  </div>`;

  const q = $('#q');
  q.value = query;
  q.addEventListener('input', () => { query = q.value; renderGrid(); });
  renderGrid();
}

function renderGrid() {
  const q = query.trim().toLowerCase();
  const list = APPS.filter(a => !q || (a.name + L(a.tag) + L(a.kind)).toLowerCase().includes(q));
  $('#grid').innerHTML = list.length ? list.map(a => `
    <a class="card" href="#${a.id}" style="--h:${a.hue}">
      <div class="card-preview">${mock(a, 0)}</div>
      <div class="card-body">
        ${icon(a)}
        <div><h3>${a.name}</h3><p>${L(a.tag)}</p></div>
        <div class="card-foot">${plats()}<span class="ver">v${a.ver} · ${fmtDate(a.date, true)}</span></div>
      </div>
    </a>`).join('') : `<p class="no-results">${t('none')}</p>`;
}

function aboutBlock() {
  return `<section id="about"><div class="wrap about">
    <div><h2>${t('about_h')}</h2><p>${t('about_p1')}</p><p>${t('about_p2')}</p></div>
    <div class="sign"><span>${t('made_by')}</span><b>Kyo Mori</b></div>
  </div></section>`;
}

function detail(a) {
  const kbds = ks => ks.map(k => `<kbd>${k}</kbd>`).join('+');
  view.innerHTML = `<div class="view" style="--h:${a.hue}"><div class="wrap">
    <a class="back" href="#apps">${t('back')}</a>
    <div class="app-head">
      ${icon(a)}
      <div style="min-width:0"><h1>${a.name}</h1><p class="tagline">${L(a.tag)}</p>
        <div class="meta"><span>${t('version')} <b>${a.ver}</b></span><span>${t('updated')} <b>${fmtDate(a.date)}</b></span><span>${L(a.kind)}</span></div></div>
      <a class="btn primary" href="#download">${dlIcon}${t('download')}</a>
    </div>
    <div class="layout">
      <div style="min-width:0">
        <div class="block"><h2>${t('shots')}</h2>
          <div class="gallery">${L(a.shots).map((s, i) => `<figure><button data-shot="${i}" aria-label="${t('open_shot')}: ${s}">${mock(a, i)}</button><figcaption>${s}</figcaption></figure>`).join('')}</div>
        </div>
        <div class="block"><h2>${t('desc')}</h2><p class="prose">${L(a.desc)}</p>
          <ul class="features">${L(a.features).map(f => `<li>${f}</li>`).join('')}</ul>
          ${a.temps ? `<div class="temps" aria-label="${t('temps')}"><span class="t-ok">&lt; 70 °C</span><span class="t-warm">70–82 °C</span><span style="color:var(--hot)">&gt; 82 °C</span></div>` : ''}
        </div>
        ${a.keys ? `<div class="block"><h2>${a.keysTitle ? L(a.keysTitle) : t('keys')}</h2><div class="keys">${a.keys.map(([k1, k2, label]) => `<div><span>${L(label)}</span><span class="kbds">${kbds(k1)}${k2 ? ` / ${kbds(k2)}` : ''}</span></div>`).join('')}</div></div>` : ''}
        <div class="block"><h2>${t('history')}</h2>
          <ol class="changelog">${a.log.map(l => `<li><div class="cv"><b>${l.v}</b><span>${fmtDate(l.d)}</span></div><ul>${L(l.items).map(i => `<li>${i}</li>`).join('')}</ul></li>`).join('')}</ol></div>
      </div>
      <aside style="min-width:0">
        <div class="block" id="download"><h2>${t('download')}</h2>
          <div class="dl">
            <div class="dl-tabs" role="tablist"><button role="tab" aria-selected="true">WINDOWS</button></div>
            <div class="dl-body">${a.files.map(f => `<div class="dl-file"><span class="kind">${L(f.kind)}</span><span class="fname">${f.file}${f.size ? ` · ${f.size}` : ''}</span>${a.release
              ? `<a class="btn primary small" href="${dlUrl(a, f)}" rel="noopener">${dlIcon}${t('download')}</a>`
              : `<span class="btn small soon" aria-disabled="true">${t('soon')}</span>`}</div>`).join('')}
              ${a.release ? '' : `<p class="dl-note">${t('soon_note')}</p>`}</div>
          </div>
        </div>
        <div class="block"><h2>${t('req')}</h2>
          <dl class="kv">${a.req.map(([k, v]) => `<dt>${L(k)}</dt><dd>${L(v)}</dd>`).join('')}</dl></div>
      </aside>
    </div>
  </div></div>`;
  view.querySelectorAll('[data-shot]').forEach(b => b.addEventListener('click', () => lightbox(a, +b.dataset.shot)));
}

function lab() {
  view.innerHTML = `<div class="view"><div class="hazard"></div><div class="wrap">
    <section class="lab-hero">
      <div class="eyebrow">${t('lab_eyebrow')}</div>
      <h1>${t('lab_h1')}</h1>
      <p>${t('lab_p')}</p>
      <div class="stage-legend">${t('stages').map(([s, d], i) => `<div style="--n:${i}"><b>${s}</b><span>${d}</span></div>`).join('')}</div>
    </section>
    ${LAB.length ? '' : `<div class="empty">
      <svg class="flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>
      <h3>${t('empty_h')}</h3><p>${t('empty_p')}</p></div>`}
  </div></div>`;
}

/* ---------- lightbox ---------- */
function lightbox(a, i) {
  const n = L(a.shots).length;
  const box = document.createElement('div');
  box.className = 'lightbox'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
  const draw = () => {
    box.innerHTML = `<div class="lb-inner">${mock(a, i)}<div class="lb-bar"><button class="btn" data-m="-1" aria-label="←">←</button><span>${L(a.shots)[i]} · ${i + 1} ${t('shot_of')} ${n}</span><span style="display:flex;gap:8px"><button class="btn" data-m="1" aria-label="→">→</button><button class="btn" data-m="x">${t('close')}</button></span></div></div>`;
    box.querySelector('[data-m="x"]').focus();
  };
  const close = () => { box.remove(); document.removeEventListener('keydown', key); };
  const move = d => { i = (i + d + n) % n; draw(); };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') move(1); if (e.key === 'ArrowLeft') move(-1); };
  box.addEventListener('click', e => {
    const m = e.target.closest('[data-m]');
    if (m) return m.dataset.m === 'x' ? close() : move(+m.dataset.m);
    if (e.target === box) close();
  });
  document.addEventListener('keydown', key);
  document.body.appendChild(box); draw();
}

/* ---------- toast & global clicks ---------- */
let toastT;
function toast(html) {
  const el = $('#toast'); el.innerHTML = html; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200);
}
document.addEventListener('click', async e => {
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    try { await navigator.clipboard.writeText(cp.dataset.copy); toast(t('copied')); }
    catch { const r = document.createRange(); r.selectNodeContents(cp.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t('selected')); }
  }
  const lb = e.target.closest('[data-lang]');
  if (lb && lb.dataset.lang !== lang) {
    lang = lb.dataset.lang;
    try { localStorage.setItem('np-lang', lang); } catch { }
    const y = scrollY; route(true); scrollTo(0, y);
  }
});

/* ---------- routing ---------- */
function applyChrome() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
}
function route(keepScroll) {
  applyChrome();
  const h = location.hash.slice(1);
  const app = APPS.find(a => a.id === h);
  let nav = 'apps';
  if (h === 'download') {
    if (keepScroll === true) { const a = APPS.find(x => x.name === $('.app-head h1')?.textContent); if (a) detail(a); }
    return;
  }
  if (app) detail(app);
  else if (h === 'lab') { nav = 'lab'; lab(); }
  else {
    if (h === 'about') nav = 'about';
    home();
    if ((h === 'about' || h === 'catalog') && keepScroll !== true) { $('#' + h).scrollIntoView(); }
  }
  if (keepScroll !== true && !(h === 'about' || h === 'catalog')) scrollTo(0, 0);
  document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
}
window.addEventListener('hashchange', () => route());
route();
</script>
